# Publishes estimetry to npm and GitHub Releases when a vX.Y.Z tag is pushed.
# npm trusts this file by its name (trusted publishing): do not rename it.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Tag matches package.json and has release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME"
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Publish to npm unless the version is there already
        run: |
          name=$(node -p "require('./package.json').name")
          version="${GITHUB_REF_NAME#v}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: publishing skipped."
          else
            npm publish --provenance --access public
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
